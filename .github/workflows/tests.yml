name: tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# a newer push to the same branch/PR supersedes an in-flight run
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # report every version's result, not just the first failure
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Show environment
        run: |
          python -c "import numpy, numba, scipy; print('numpy', numpy.__version__, '| numba', numba.__version__, '| scipy', scipy.__version__)"
          python -c "from numba import get_num_threads; print('numba threads:', get_num_threads())"

      # -p no:randomly keeps ordering deterministic if pytest-randomly ever lands in the env;
      # --durations surfaces the slow brute-force reference solves when CI time creeps up.
      - name: Run tests
        run: python -m pytest tests/ -v --durations=10
