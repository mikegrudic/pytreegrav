[build-system]
# setuptools>=61 is the floor for reading [project] from here; `wheel` is no longer listed, as
# setuptools.build_meta pulls it in itself and naming it is a long-standing no-op.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytreegrav"
version = "1.3.0"
description = "Fast approximate gravitational force and potential calculations"
readme = "README.md"
authors = [{ name = "Mike Grudic", email = "mike.grudich@gmail.com" }]
# 3.8 is the real floor, and it is set by numba, not by this package: the oldest release satisfying
# the numba>=0.57 floor below declares Requires-Python >=3.8, so pip finds no numba at all on 3.7.
# The package's own source is 3.6-clean (vermin and ast feature_version agree; the binding construct
# is an underscore in a numeric literal in octree.py). Verified by running the suite on real
# interpreters: 3.8 gives numpy 1.24.4 / numba 0.58.1 / scipy 1.10.1 and passes all 223 tests, the
# same as 3.13. Note upstream 3.8 is EOL, so raising this is a support-policy call, not a technical one.
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Runtime dependencies, stated here rather than read from requirements.txt. `python -m build`
# builds the wheel from the sdist, requirements.txt was never in the sdist (there is no
# MANIFEST.in), so the file read silently produced an empty list and every release before 1.3.0
# shipped with no declared dependencies at all -- check requires_dist on PyPI for 1.1.4.
#
# requirements.txt stays as the dev/CI list; it is not the same set. healpy and pyerfa appear
# there but are imported nowhere in the package, and pytest is test-only.
#
# numba>=0.57 is a hard floor: treewalk and grouped_treewalk import parallel_chunksize at module
# scope, which was added in 0.57, so anything older fails at import rather than at use.
dependencies = [
    "numpy",
    "numba>=0.57",
    "scipy", # scipy.spatial.transform.Rotation, used to build the ray grid in treewalk
]

# Optional CUDA backend (pytreegrav.cuda), used only when explicitly imported or via
# device="cuda". numba-cuda provides numba.cuda from numba 0.62 on, where the CUDA target was
# split out of numba proper; it pulls in the cuda-bindings/core/pathfinder wheels and leaves
# numba, numpy and llvmlite untouched.
[project.optional-dependencies]
cuda = ["numba-cuda>=0.30"]

[project.urls]
"Bug Tracker" = "https://github.com/mikegrudic/pytreegrav"

# src layout: the equivalent of setup.py's package_dir={"": "src"} plus find_packages(where="src").
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
# Match the previous black scope: format Python only, leave Markdown code blocks alone.
extend-exclude = ["*.md"]
